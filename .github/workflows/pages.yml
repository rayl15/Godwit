# Publishes site/ to GitHub Pages.
#
# The site is plain HTML with no build step, matching the package's own rule
# that nothing here needs a toolchain to run. This workflow only uploads it.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The banner and screenshots live in docs/assets for the README. Copying
      # them at publish time rather than committing a second copy under site/
      # keeps the two from drifting — which they already had.
      - run: |
          mkdir -p site/assets
          cp docs/assets/banner.svg docs/assets/*.png site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
